<style>

body{margin:0}
.paper{animation:unroll 18s cubic-bezier(.6,.05,.25,1) infinite}
@keyframes unroll{0%,3%{width:0}28%,96%{width:1040px}100%{width:1040px;opacity:0}}
.fog{animation:fog 18s ease-in-out infinite}
@keyframes fog{0%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
.rise{animation:rise 18s ease-out infinite}
@keyframes rise{0%,24%{opacity:0;transform:translateY(12px)}34%,96%{opacity:1;transform:none}100%{opacity:0}}
.bg{background:url(assets/b7d15e940b06f0d2a431e60874daecab.jpg) center/cover no-repeat}

.dc-Butterflies{margin:0}
.dc-Butterflies .bfw{display:flex;align-items:flex-start;perspective:260px}
.dc-Butterflies .bfw img{display:block;width:50%;height:auto}
.dc-Butterflies .wl{transform-origin:100% 50%;animation:Butterflies_wl .34s ease-in-out infinite alternate}
.dc-Butterflies .wr{transform-origin:0% 50%;animation:Butterflies_wr .34s ease-in-out infinite alternate}
@keyframes Butterflies_wl{from{transform:rotateY(0deg)}to{transform:rotateY(68deg)}}
@keyframes Butterflies_wr{from{transform:rotateY(0deg)}to{transform:rotateY(-68deg)}}
.dc-Butterflies .fly{animation-timing-function:ease-in-out;animation-iteration-count:infinite;will-change:transform}
.dc-Butterflies .p1{animation-name:Butterflies_p1}
.dc-Butterflies .p2{animation-name:Butterflies_p2}
.dc-Butterflies .p3{animation-name:Butterflies_p3}
@keyframes Butterflies_p1{0%{transform:translate(0,0) rotate(-10deg)}25%{transform:translate(140px,-70px) rotate(8deg)}50%{transform:translate(60px,-160px) rotate(-6deg)}75%{transform:translate(-100px,-70px) rotate(10deg)}100%{transform:translate(0,0) rotate(-10deg)}}
@keyframes Butterflies_p2{0%{transform:translate(0,0) rotate(6deg)}20%{transform:translate(-90px,50px) rotate(-8deg)}45%{transform:translate(-180px,-20px) rotate(4deg)}70%{transform:translate(-60px,-110px) rotate(-10deg)}100%{transform:translate(0,0) rotate(6deg)}}
@keyframes Butterflies_p3{0%{transform:translate(0,0) rotate(0deg)}30%{transform:translate(200px,40px) rotate(12deg)}55%{transform:translate(260px,-90px) rotate(-6deg)}80%{transform:translate(90px,-130px) rotate(8deg)}100%{transform:translate(0,0) rotate(0deg)}}
@media (prefers-reduced-motion: reduce){.dc-Butterflies .fly,.dc-Butterflies .wl,.dc-Butterflies .wr{animation:none}}
</style>
<link rel="stylesheet" href="site.css">
</head>
<body class="page-opening">

<div class="fog" style="position: absolute; inset: -100px; background: radial-gradient(ellipse 50% 40% at 30% 40%, rgba(220,210,255,0.14), transparent 70%), radial-gradient(ellipse 45% 35% at 72% 62%, rgba(160,185,235,0.12), transparent 70%); pointer-events: none"></div>

<div class="paper" style="position: absolute; left: 50%; top: 150px; height: 600px; transform: translateX(-50%); overflow: visible">
<div style="position: absolute; inset: 0; overflow: hidden; background: #1c1638">
<div style="position: absolute; left: 50%; top: 0; width: 1040px; height: 600px; transform: translateX(-50%)">
<div style="position: absolute; inset: 18px; border: 1px solid #c8ab6e"></div>
<div style="position: absolute; inset: 26px; border: 1px solid rgba(200,171,110,0.4)"></div>

<img src="assets/e0ae6c8c2714e12759d4eb290f43c61f.png" alt="Gold line drawing of a woman in hanfu holding a small planet among constellations" style="width: 100%; height: 100%; object-fit: cover; object-position: center 10%; display: block; -webkit-mask-image: radial-gradient(closest-side at 50% 45%, #000 50%, transparent 100%); mask-image: radial-gradient(closest-side at 50% 45%, #000 50%, transparent 100%)">
</div>
<div class="rise" style="position: absolute; left: 110px; top: 190px; width: 480px; color: #ece8f3">
<div style="font-size: 13px; letter-spacing: 0.4em; color: #c8ab6e">MICHELLE WANG (PEIFEIER) · 王佩菲迩</div>
<div style="margin-top: 22px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 76px; line-height: 1">Welcome to<br>my website</div>
<div style="margin-top: 22px; font-size: 26px; letter-spacing: 0.3em; color: #b9a9ea">欢迎来到我的小站</div>
<div style="width: 56px; height: 1px; background: #c8ab6e; margin-top: 34px"></div>
</div>
</div>
</div>
<div style="position: absolute; left: -22px; top: -24px; width: 22px; height: 648px; background: linear-gradient(90deg, #2a2233, #4a3d52 50%, #2a2233); border-radius: 4px">
<div style="position: absolute; left: -3px; top: -14px; width: 28px; height: 16px; border: 1px solid #c8ab6e; background: #1d1824; border-radius: 3px"></div>

<div style="position: absolute; left: -3px; top: -14px; width: 28px; height: 16px; border: 1px solid #c8ab6e; background: #1d1824; border-radius: 3px"></div>
<div style="position: absolute; left: -3px; bottom: -14px; width: 28px; height: 16px; border: 1px solid #c8ab6e; background: #1d1824; border-radius: 3px"></div>
</div>

<div style="position: absolute; inset: 0; pointer-events: none"><dc-import name="Butterflies" density="many" hint-size="1440px,900px"></dc-import></div>
<div style="position: absolute; left: 0; right: 0; bottom: 52px; text-align: center; font-size: 13px; letter-spacing: 0.35em; color: #e6e0f1; text-shadow: 0 0 12px rgba(12,10,24,0.8)">CLICK TO ENTER · 点击进入</div>

</template>
<template data-dc="Butterflies">
<div style="position: absolute; inset: 0; overflow: hidden; pointer-events: none">
<svg width="0" height="0" style="position: absolute" aria-hidden="true"><defs>
<linearGradient id="bwg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{{fillA}}"/><stop offset="0.6" stop-color="{{fillB}}"/><stop offset="1" stop-color="{{fillC}}"/></linearGradient>
</defs></svg>
<sc-for list="{{bs}}" as="b" hint-placeholder-count="12">
<div class="fly {{b.path}}" style="position: absolute; left: {{b.x}}; top: {{b.y}}; width: {{b.w}}; opacity: {{b.op}}; animation-duration: {{b.dur}}; animation-delay: {{b.del}}">
<div class="bfw" style="filter: drop-shadow(0 0 5px {{glow}}) drop-shadow(0 0 12px {{glow}})"><img class="wl" src="assets/4c92f7b05e3b0b8bafcf0ff6a8e48d74.png" alt="" style="animation-duration: {{b.flap}}; animation-delay: {{b.del}}"><img class="wr" src="assets/dd0fbc724844aac659c9b8c004047feb.png" alt="" style="animation-duration: {{b.flap}}; animation-delay: {{b.del}}"></div>
</div>
</sc-for>

<script src="dc.js"></script>
<script src="site.js"></script>
<script src="extras.js"></script>
<script>
DC.define('__Transition', class extends DCLogic { renderVals() { return {}; } });
DC.define('Opening', (function(){
class Component extends DCLogic {
  renderVals() { return {}; }
}
return Component;
})());
DC.define('Butterflies', (function(){
class Component extends DCLogic {
  renderVals() {
    const pts = [
      [52, 14, 46], [64, 8, 36], [70, 30, 54], [44, 40, 40], [80, 20, 44], [58, 52, 32],
      [74, 60, 40], [18, 16, 28], [30, 50, 24], [88, 42, 34], [12, 66, 22], [40, 72, 30]
    ];
    const many = (this.props.density ?? 'many') === 'many';
    const list = many ? pts : pts.filter((p, i) => i % 2 === 0);
    const paths = ['p1', 'p2', 'p3'];
    return {
      stroke: this.props.stroke ?? '#e7c77f',
      glow: this.props.glow ?? 'rgba(255,214,140,0.55)',
      fillA: '#e6dcff', fillB: '#9d8cf0', fillC: '#6a73d6',
      bs: list.map((p, i) => ({
        x: p[0] + '%', y: p[1] + '%', w: Math.round(p[2] * 1.15) + 'px',
        path: paths[i % 3],
        dur: (16 + (i * 7) % 14) + 's',
        del: '-' + ((i * 3.7) % 16).toFixed(1) + 's',
        flap: (0.24 + (i % 4) * 0.05).toFixed(2) + 's',
        op: p[2] < 30 ? 0.7 : 0.95
      }))
    };
  }
}
return Component;
})());
DC.mount('Opening', {}, document.getElementById('dc-root'), {});

SITE.init('Opening');
</script>
